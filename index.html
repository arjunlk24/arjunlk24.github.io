<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abhay Raj Mathur — Cyber Security | Programming</title>
<meta name="description" content="Portfolio of Abhay Raj Mathur — Cyber Security Enthusiast, Penetration Tester, Programmer.">
<link rel="stylesheet" href="assets/css/style.css">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<div id="scroll-progress"></div>
<button id="back-to-top" aria-label="Back to top">&#8593;</button>
<div id="root"></div>
<script src="assets/js/render.js"></script>
<script>
  fetch('data.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => renderApp(document.getElementById('root'), data, false))
    .catch(err => {
      document.getElementById('root').innerHTML =
        '<p style="padding:40px;color:#e66">Could not load data.json — ' + err + '</p>';
    });
</script>
</body>
</html>
