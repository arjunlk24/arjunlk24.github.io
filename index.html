<body>
<video class="site-bg" autoplay muted loop playsinline>
  <source src="assets/media/galaxy.webm" type="video/webm">
  <source src="assets/media/galaxy.mp4" type="video/mp4">
</video>
<div class="site-bg-overlay"></div>

<button id="menu-toggle" aria-label="Open menu">☰</button>
<div id="sidebar-backdrop"></div>
<button id="back-to-top" aria-label="Back to top">↑</button>
<div id="root"></div>

<script src="assets/js/render.js"></script>
<script>
  fetch('data.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      renderApp(document.getElementById('root'), data, false);
    })
    .catch(err => {
      document.getElementById('root').innerHTML =
        '<p style="padding:40px;font-family:monospace;color:#e66">Could not load data.json — ' + err + '</p>';
    });
</script>
</body>
